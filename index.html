<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ ghép song ngữ WikiHow</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; line-height: 1.6; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); } /* Tăng chiều rộng container lên 1 chút */
        h1 { text-align: center; color: #333; }
        .input-group { margin-bottom: 15px; }
        .input-group label { font-weight: bold; display: block; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #4CAF50; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; transition: background-color 0.3s; }
        button:hover { background-color: #45a049; }
        
        /* Cập nhật step-box và intro-box để không padding-bottom thừa */
        .step-box { border: 1px solid #ddd; border-radius: 6px; margin-top: 20px; padding: 15px; background-color: #fafafa; }
        .intro-box { background-color: #e8f4f8; border-color: #b3e5fc; }
        
        /* --- CSS MỚI CHO BỐ CỤC CHIA ĐÔI --- */
        .bilingual-row {
            display: flex;
            gap: 20px; /* Khoảng cách giữa 2 cột */
            align-items: flex-start; /* Căn chỉnh các cột theo đỉnh */
        }
        .text-de, .text-vn {
            flex: 1; /* Mỗi cột chiếm 1 phần bằng nhau (chia đôi) */
            min-width: 0; /* Đảm bảo nội dung không làm vỡ bố cục */
        }
        /* --- ĐIỀU CHỈNH CÁC PHẦN TỬ CŨ CHO PHÙ HỢP --- */
        .step-number {
            font-size: 1.2em;
            font-weight: bold;
            color: #0073e6;
            margin-bottom: 15px;
            border-bottom: 2px solid #0073e6;
            padding-bottom: 5px;
            display: block; /* Đổi sang block để nằm trên cùng */
            text-align: center; /* Căn giữa */
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }
        .text-de {
            font-weight: bold;
            color: #2c3e50;
            /* Xóa bỏ border và padding thừa vì giờ nó nằm bên trái */
            /* border-bottom: 1px dashed #ccc; -> XÓA */
            /* padding-bottom: 15px; -> XÓA */
            /* margin-bottom: 20px; -> XÓA */
        }
        .text-vn {
            color: #555;
            /* Đảm bảo border-left mờ để phân biệt */
            border-left: 1px solid #eee;
            padding-left: 20px;
        }
        
        /* --- GIỮ NGUYÊN --- */
        #status { text-align: center; font-size: 1.1em; margin-top: 15px; font-weight: bold; }
        .loading { color: #e67e22; }
        .error { color: red; }
        .success { color: green; }
        
        .sentence-item { margin: 8px 0; line-height: 1.8; }
        .sentence-num {
            display: inline-block;
            background-color: #ffeb3b;
            color: #d35400;
            font-size: 0.85em;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 8px;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            vertical-align: text-bottom;
        }
        .section-label { font-size: 0.9em; color: #888; text-transform: uppercase; margin-bottom: 10px; display: block; font-weight: normal;}
        .article-title { font-size: 1.4em; color: #c0392b; margin-bottom: 10px; text-transform: uppercase; font-weight: bold;}
    </style>
</head>
<body>

<div class="container">
    <h1>Công cụ ghép song ngữ WikiHow</h1>
    <p style="text-align: center; color: #d35400; font-size: 0.9em;">
        <i>⚠️ Nhớ BẬT tiện ích "Allow CORS" trên trình duyệt trước khi chạy!</i>
    </p>
    
    <div class="input-group">
        <label>🔗 Dán Link Bản Gốc (VD: Tiếng Đức, Anh):</label>
        <input type="text" id="linkGoc" placeholder="https://de.wikihow.com/...">
    </div>
    <div class="input-group">
        <label>🔗 Dán Link Bản Dịch (VD: Tiếng Việt):</label>
        <input type="text" id="linkDich" placeholder="https://www.wikihow.vn/...">
    </div>
    
    <button onclick="batDauGhep()">Bắt đầu ghép nối</button>

    <div id="status"></div>
    <div id="content"></div>
</div>

<script>
    async function fetchHtml(url) {
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error(`Không thể lấy dữ liệu (Mã lỗi: ${response.status}). Vui lòng kiểm tra lại link hoặc bật Allow CORS!`);
        }
        const htmlText = await response.text();
        const parser = new DOMParser();
        return parser.parseFromString(htmlText, "text/html");
    }

    function danhSoThuTuCau(text) {
        if (!text) return '';
        let lines = text.split('\n'); 
        let resultHtml = '';
        let count = 1; 

        lines.forEach(line => {
            let trimmed = line.trim();
            if (!trimmed) return;

            let sentences = trimmed.match(/.*?[.?!]+(?:["'”]*)(?:\s+|$)|.+/g);
            
            if (sentences) {
                sentences.forEach(s => {
                    let sTrim = s.trim();
                    if (sTrim) {
                        resultHtml += `<div class="sentence-item"><span class="sentence-num">${count}</span>${sTrim}</div>`;
                        count++;
                    }
                });
            }
        });
        return resultHtml;
    }

    // Hàm phụ để trích xuất Tiêu đề và Phần mở đầu
    function layTieuDeVaMoDau(doc) {
        let title = doc.querySelector('h1') ? doc.querySelector('h1').innerText.trim() : 'Không tìm thấy Tiêu đề';
        
        // Lấy các thẻ <p> nằm trong phần giới thiệu (#intro)
        let introParagraphs = doc.querySelectorAll('#intro p');
        let introText = '';
        if (introParagraphs.length > 0) {
            introParagraphs.forEach(p => introText += p.innerText + '\n');
        } else {
            // Backup trường hợp giao diện WikiHow thay đổi
            introText = doc.querySelector('#intro') ? doc.querySelector('#intro').innerText.trim() : '';
        }
        
        return { title, introText };
    }

    async function batDauGhep() {
        const urlGoc = document.getElementById('linkGoc').value.trim();
        const urlDich = document.getElementById('linkDich').value.trim();
        const statusDiv = document.getElementById('status');
        const contentDiv = document.getElementById('content');

        if (!urlGoc || !urlDich) {
            statusDiv.innerHTML = '<span class="error">Vui lòng dán đầy đủ cả 2 link trước khi chạy!</span>';
            return;
        }

        statusDiv.innerHTML = '<span class="loading">Đang lấy dữ liệu... ⚡</span>';
        contentDiv.innerHTML = ''; 

        try {
            const [docGoc, docDich] = await Promise.all([fetchHtml(urlGoc), fetchHtml(urlDich)]);

            // 1. LẤY TIÊU ĐỀ VÀ PHẦN MỞ ĐẦU
            const modauGoc = layTieuDeVaMoDau(docGoc);
            const modauDich = layTieuDeVaMoDau(docDich);

            // Tạo Box hiển thị phần Mở đầu (Có màu nền khác một chút để phân biệt)
            const introBox = document.createElement('div');
            introBox.className = 'step-box intro-box';
            
            // --- CẬP NHẬT CẤU TRÚC HTML CHO PHẦN MỞ ĐẦU (CHIA ĐÔI) ---
            introBox.innerHTML = `
                <div class="step-header">
                    <div class="step-number">Phần Mở Đầu</div>
                </div>
                <div class="step-body bilingual-row"> <div class="text-de"> <span class="section-label">🌐 BẢN GỐC (Tiếng Đức/Anh)</span>
                        <div class="article-title">${modauGoc.title}</div>
                        ${danhSoThuTuCau(modauGoc.introText)}
                    </div>
                    <div class="text-vn"> <span class="section-label">🇻🇳 BẢN DỊCH (Tiếng Việt)</span>
                        <div class="article-title">${modauDich.title}</div>
                        ${danhSoThuTuCau(modauDich.introText)}
                    </div>
                </div>
            `;
            contentDiv.appendChild(introBox);

            // 2. LẤY CÁC BƯỚC NHƯ CŨ
            const stepsGoc = docGoc.querySelectorAll('.step');
            const stepsDich = docDich.querySelectorAll('.step');

            if (stepsGoc.length === 0 || stepsDich.length === 0) {
                statusDiv.innerHTML = '<span class="success">Đã tải phần mở đầu (Bài viết này không chia theo định dạng Bước).</span>';
                return;
            }

            const maxSteps = Math.min(stepsGoc.length, stepsDich.length);
            statusDiv.innerHTML = `<span class="success">✅ Thành công! Đã ghép nối Mở đầu và ${maxSteps} bước bài viết.</span>`;

            for (let i = 0; i < maxSteps; i++) {
                let textGocHtml = danhSoThuTuCau(stepsGoc[i].innerText);
                let textDichHtml = danhSoThuTuCau(stepsDich[i].innerText);

                const stepBox = document.createElement('div');
                stepBox.className = 'step-box';
                
                // --- CẬP NHẬT CẤU TRÚC HTML CHO CÁC BƯỚC (CHIA ĐÔI) ---
                stepBox.innerHTML = `
                    <div class="step-header">
                        <div class="step-number">Bước ${i + 1}</div>
                    </div>
                    <div class="step-body bilingual-row"> <div class="text-de"> <span class="section-label">🌐 BẢN GỐC (Tiếng Đức/Anh)</span>
                            ${textGocHtml}
                        </div>
                        <div class="text-vn"> <span class="section-label">🇻🇳 BẢN DỊCH (Tiếng Việt)</span>
                            ${textDichHtml}
                        </div>
                    </div>
                `;
                contentDiv.appendChild(stepBox);
            }
        } catch (error) {
            statusDiv.innerHTML = `<span class="error">❌ Có lỗi xảy ra: ${error.message}</span>`;
        }
    }
</script>

</body>
</html>
