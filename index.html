<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ ghép song ngữ WikiHow Pro Max</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; line-height: 1.6; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .input-group { margin-bottom: 15px; }
        .input-group label { font-weight: bold; display: block; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #4CAF50; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; transition: background-color 0.3s; }
        button:hover { background-color: #45a049; }
        
        .step-box { border: 1px solid #ddd; border-radius: 6px; margin-top: 20px; padding: 15px; background-color: #fafafa; }
        .intro-box { background-color: #e8f4f8; border-color: #b3e5fc; }
        .extra-box { background-color: #fff9e6; border-color: #ffe082; }
        .ingredient-box { background-color: #e8f5e9; border-color: #a5d6a7; }
        
        /* Bố cục chia đôi */
        .bilingual-row { display: flex; gap: 20px; align-items: flex-start; }
        .text-de, .text-vn { flex: 1; min-width: 0; }
        
        .step-number {
            font-size: 1.2em; font-weight: bold; color: #0073e6; margin-bottom: 15px;
            border-bottom: 2px solid #0073e6; padding-bottom: 5px; display: block;
            text-align: center; width: fit-content; margin-left: auto; margin-right: auto;
        }
        .extra-box .step-number { color: #d35400; border-color: #d35400; }
        .ingredient-box .step-number { color: #2e7d32; border-color: #2e7d32; }

        .text-de { font-weight: bold; color: #2c3e50; }
        .text-vn { color: #555; border-left: 1px solid #eee; padding-left: 20px; }
        
        #status { text-align: center; font-size: 1.1em; margin-top: 15px; font-weight: bold; }
        .loading { color: #e67e22; }
        .error { color: red; }
        .success { color: green; }
        
        .sentence-item { margin: 8px 0; line-height: 1.8; }
        .sentence-num {
            display: inline-block; background-color: #ffeb3b; color: #d35400; font-size: 0.85em;
            font-weight: bold; padding: 2px 8px; border-radius: 4px; margin-right: 8px;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.1); vertical-align: text-bottom;
        }
        .section-label { font-size: 0.9em; color: #888; text-transform: uppercase; margin-bottom: 10px; display: block; font-weight: normal;}
        .article-title { font-size: 1.4em; color: #c0392b; margin-bottom: 10px; text-transform: uppercase; font-weight: bold;}
        .empty-note { color: #999; font-style: italic; }

        @media (max-width: 768px) {
            .bilingual-row { flex-direction: column; }
            .text-vn { border-left: none; padding-left: 0; margin-top: 20px; border-top: 1px dashed #ccc; padding-top: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Công cụ ghép song ngữ WikiHow Pro Max</h1>
    <p style="text-align: center; color: #d35400; font-size: 0.9em;">
        <i>⚠️ Hãy chắc chắn bạn đã BẬT tiện ích "Allow CORS" trên trình duyệt nhé!</i>
    </p>
    
    <div class="input-group">
        <label>🔗 Dán Link Bản Gốc (VD: Tiếng Đức, Anh):</label>
        <input type="text" id="linkGoc" placeholder="https://de.wikihow.com/...">
    </div>
    <div class="input-group">
        <label>🔗 Dán Link Bản Dịch (VD: Tiếng Việt):</label>
        <input type="text" id="linkDich" placeholder="https://www.wikihow.vn/...">
    </div>
    
    <button onclick="batDauGhep()">Bắt đầu ghép nối</button>

    <div id="status"></div>
    <div id="content"></div>
</div>

<script>
    async function fetchHtml(url) {
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error(`Mã lỗi: ${response.status}. Hãy chắc chắn tiện ích Allow CORS đang BẬT!`);
        }
        const htmlText = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, "text/html");

        // --- BỘ LỌC RÁC: Xóa sạch toàn bộ thẻ script, style, noscript để không bị lọt code vào text ---
        const ruyBangRac = doc.querySelectorAll('script, style, noscript');
        ruyBangRac.forEach(node => node.remove());

        return doc;
    }

    function danhSoThuTuCau(text) {
        if (!text) return '';
        let lines = text.split('\n'); 
        let resultHtml = '';
        let count = 1; 

        lines.forEach(line => {
            let trimmed = line.trim();
            if (!trimmed) return;

            // Xử lý dòng danh sách (nguyên liệu) không có dấu chấm cuối câu
            if (!/[.?!]/.test(trimmed) || trimmed.length < 25) {
                resultHtml += `<div class="sentence-item"><span class="sentence-num">${count}</span>${trimmed}</div>`;
                count++;
                return;
            }

            let sentences = trimmed.match(/.*?[.?!]+(?:["'”]*)(?:\s+|$)|.+/g);
            if (sentences) {
                sentences.forEach(s => {
                    let sTrim = s.trim();
                    if (sTrim) {
                        resultHtml += `<div class="sentence-item"><span class="sentence-num">${count}</span>${sTrim}</div>`;
                        count++;
                    }
                });
            }
        });
        return resultHtml;
    }

    // HÀM MỚI: Dò tìm cực mạnh (Leo cả lên thẻ cha nếu cần)
    function layNoiDungPhan(doc, selectors) {
        let node = doc.querySelector(selectors);
        if (!node) return '';
        
        // Nếu selector chỉ bắt trúng thẻ Tiêu đề (SPAN, H2, H3), nó sẽ leo lên thẻ DIV bọc ngoài để lấy trọn nội dung
        if (node.tagName === 'SPAN' || node.tagName === 'H2' || node.tagName === 'H3') {
            let wrapper = node.closest('.section');
            if (wrapper) return wrapper.innerText.trim();
            // Phương án dự phòng nếu web không có class .section
            return node.parentElement.innerText.trim();
        }
        return node.innerText.trim();
    }

    function layTieuDeVaMoDau(doc) {
        let title = doc.querySelector('h1') ? doc.querySelector('h1').innerText.trim() : 'Không tìm thấy Tiêu đề';
        let introNode = doc.querySelector('#intro') || doc.querySelector('.mf-section-0');
        let introText = introNode ? introNode.innerText.trim() : '';
        return { title, introText };
    }

    async function batDauGhep() {
        const urlGoc = document.getElementById('linkGoc').value.trim();
        const urlDich = document.getElementById('linkDich').value.trim();
        const statusDiv = document.getElementById('status');
        const contentDiv = document.getElementById('content');

        if (!urlGoc || !urlDich) {
            statusDiv.innerHTML = '<span class="error">Vui lòng dán đầy đủ cả 2 link trước khi chạy!</span>';
            return;
        }

        statusDiv.innerHTML = '<span class="loading">Đang phân tích và dò tìm các lớp ẩn... ⚡</span>';
        contentDiv.innerHTML = ''; 

        try {
            const [docGoc, docDich] = await Promise.all([fetchHtml(urlGoc), fetchHtml(urlDich)]);

            // 1. MỞ ĐẦU
            const modauGoc = layTieuDeVaMoDau(docGoc);
            const modauDich = layTieuDeVaMoDau(docDich);

            const introBox = document.createElement('div');
            introBox.className = 'step-box intro-box';
            introBox.innerHTML = `
                <div class="step-header"><div class="step-number">Phần Mở Đầu & Mục Lục</div></div>
                <div class="step-body bilingual-row"> 
                    <div class="text-de"> <span class="section-label">🌐 BẢN GỐC</span>
                        <div class="article-title">${modauGoc.title}</div>
                        ${danhSoThuTuCau(modauGoc.introText)}
                    </div>
                    <div class="text-vn"> <span class="section-label">🇻🇳 BẢN DỊCH</span>
                        <div class="article-title">${modauDich.title}</div>
                        ${danhSoThuTuCau(modauDich.introText)}
                    </div>
                </div>
            `;
            contentDiv.appendChild(introBox);

            // TẬP HỢP CÁC ID CỦA NHIỀU NGÔN NGỮ (Anh, Đức, Việt)
            const cacPhanKhamPha = [
                { ids: '#ingredients, .ingredients, #Zubereitungen, .Zubereitungen, #Zutaten, .Zutaten, #Nguyên_liệu, .Nguyên_liệu', title: '🥗 Nguyên liệu / Chuẩn bị', cssClass: 'ingredient-box' },
                { ids: '#tips, .tips, #Tipps, .Tipps, #Lời_khuyên, .Lời_khuyên', title: '💡 Lời khuyên (Tips)', cssClass: 'extra-box' },
                { ids: '#warnings, .warnings, #Warnungen, .Warnungen, #Cảnh_báo, .Cảnh_báo', title: '⚠️ Cảnh báo (Warnings)', cssClass: 'extra-box' },
                { ids: '#thingsyoullneed, .thingsyoullneed, #Was_du_brauchst, .Was_du_brauchst, #Những_thứ_bạn_cần, .Những_thứ_bạn_cần', title: '🛠️ Những thứ bạn cần', cssClass: 'extra-box' },
                { ids: '#qa, .qa_container, #Q_&_A, #F&A', title: '❓ Hỏi đáp (Q&A)', cssClass: 'extra-box' },
                { ids: '#references, .references, #Referenzen, .Referenzen, #Tham_khảo, .Tham_khảo', title: '🔗 Nguồn & Tham khảo', cssClass: 'extra-box' }
            ];

            const renderContentText = (text) => {
                if (!text) return '<span class="empty-note">Không có phần này.</span>';
                return danhSoThuTuCau(text);
            };

            const renderBox = (title, textGoc, textDich, boxClass) => {
                if (!textGoc && !textDich) return; // Nếu cả 2 web đều không có phần này thì bỏ qua
                const box = document.createElement('div');
                box.className = `step-box ${boxClass}`;
                box.innerHTML = `
                    <div class="step-header"><div class="step-number">${title}</div></div>
                    <div class="step-body bilingual-row">
                        <div class="text-de"><span class="section-label">🌐 BẢN GỐC</span>${renderContentText(textGoc)}</div>
                        <div class="text-vn"><span class="section-label">🇻🇳 BẢN DỊCH</span>${renderContentText(textDich)}</div>
                    </div>
                `;
                contentDiv.appendChild(box);
            };

            // 2. QUÉT NGUYÊN LIỆU (Trích xuất trước các bước)
            const nguyenLieu = cacPhanKhamPha[0];
            const textNlGoc = layNoiDungPhan(docGoc, nguyenLieu.ids);
            const textNlDich = layNoiDungPhan(docDich, nguyenLieu.ids);
            renderBox(nguyenLieu.title, textNlGoc, textNlDich, nguyenLieu.cssClass);

            // 3. QUÉT CÁC BƯỚC (STEPS)
            const stepsGoc = docGoc.querySelectorAll('.step');
            const stepsDich = docDich.querySelectorAll('.step');
            const maxSteps = Math.min(stepsGoc.length, stepsDich.length);

            for (let i = 0; i < maxSteps; i++) {
                renderBox(`Bước ${i + 1}`, stepsGoc[i].innerText, stepsDich[i].innerText, '');
            }

            // 4. QUÉT CÁC PHẦN CÒN LẠI (Lời khuyên, Cảnh báo...)
            for (let i = 1; i < cacPhanKhamPha.length; i++) {
                const phan = cacPhanKhamPha[i];
                const textGoc = layNoiDungPhan(docGoc, phan.ids);
                const textDich = layNoiDungPhan(docDich, phan.ids);
                renderBox(phan.title, textGoc, textDich, phan.cssClass);
            }

            statusDiv.innerHTML = `<span class="success">✅ Hoàn tất! Đã quét xuyên qua các ID ẩn của ngôn ngữ.</span>`;

        } catch (error) {
            statusDiv.innerHTML = `<span class="error">❌ Có lỗi xảy ra: ${error.message}</span>`;
        }
    }
</script>

</body>
</html>
