<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ ghép song ngữ WikiHow</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; line-height: 1.6; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .input-group { margin-bottom: 15px; }
        .input-group label { font-weight: bold; display: block; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #4CAF50; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; transition: background-color 0.3s; }
        button:hover { background-color: #45a049; }
        
        .step-box { border: 1px solid #ddd; border-radius: 6px; margin-top: 20px; padding: 15px; background-color: #fafafa; }
        .intro-box { background-color: #e8f4f8; border-color: #b3e5fc; }
        .extra-box { background-color: #fff9e6; border-color: #ffe082; } /* Màu riêng cho phần Tips/Warnings */
        
        /* Bố cục chia đôi */
        .bilingual-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .text-de, .text-vn {
            flex: 1;
            min-width: 0;
        }
        
        .step-number {
            font-size: 1.2em;
            font-weight: bold;
            color: #0073e6;
            margin-bottom: 15px;
            border-bottom: 2px solid #0073e6;
            padding-bottom: 5px;
            display: block;
            text-align: center;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }
        .extra-box .step-number { color: #d35400; border-color: #d35400; } /* Đổi màu tiêu đề phần phụ */

        .text-de { font-weight: bold; color: #2c3e50; }
        .text-vn { color: #555; border-left: 1px solid #eee; padding-left: 20px; }
        
        #status { text-align: center; font-size: 1.1em; margin-top: 15px; font-weight: bold; }
        .loading { color: #e67e22; }
        .error { color: red; }
        .success { color: green; }
        
        .sentence-item { margin: 8px 0; line-height: 1.8; }
        .sentence-num {
            display: inline-block;
            background-color: #ffeb3b;
            color: #d35400;
            font-size: 0.85em;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 8px;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            vertical-align: text-bottom;
        }
        .section-label { font-size: 0.9em; color: #888; text-transform: uppercase; margin-bottom: 10px; display: block; font-weight: normal;}
        .article-title { font-size: 1.4em; color: #c0392b; margin-bottom: 10px; text-transform: uppercase; font-weight: bold;}

        /* CSS MỚI: Tối ưu cho màn hình nhỏ (Điện thoại) */
        @media (max-width: 768px) {
            .bilingual-row { flex-direction: column; }
            .text-vn { border-left: none; padding-left: 0; margin-top: 20px; border-top: 1px dashed #ccc; padding-top: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Công cụ ghép song ngữ WikiHow</h1>
    <p style="text-align: center; color: #555; font-size: 0.9em;">
        <i>Tự động ghép: Mở đầu ➔ Các bước ➔ Lời khuyên ➔ Cảnh báo</i>
    </p>
    
    <div class="input-group">
        <label>🔗 Dán Link Bản Gốc (VD: Tiếng Đức, Anh):</label>
        <input type="text" id="linkGoc" placeholder="https://de.wikihow.com/...">
    </div>
    <div class="input-group">
        <label>🔗 Dán Link Bản Dịch (VD: Tiếng Việt):</label>
        <input type="text" id="linkDich" placeholder="https://www.wikihow.vn/...">
    </div>
    
    <button onclick="batDauGhep()">Bắt đầu ghép nối</button>

    <div id="status"></div>
    <div id="content"></div>
</div>

<script>
    // Hàm fetch có tích hợp sẵn CorsProxy để không cần bật Allow CORS thủ công
    async function fetchHtml(url) {
        // Dùng proxy để vượt rào CORS
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
        const response = await fetch(proxyUrl);
        if (!response.ok) {
            throw new Error(`Không thể lấy dữ liệu (Mã lỗi: ${response.status}). Có thể link sai hoặc website chặn.`);
        }
        const htmlText = await response.text();
        const parser = new DOMParser();
        return parser.parseFromString(htmlText, "text/html");
    }

    function danhSoThuTuCau(text) {
        if (!text) return '';
        let lines = text.split('\n'); 
        let resultHtml = '';
        let count = 1; 

        lines.forEach(line => {
            let trimmed = line.trim();
            if (!trimmed) return;

            let sentences = trimmed.match(/.*?[.?!]+(?:["'”]*)(?:\s+|$)|.+/g);
            
            if (sentences) {
                sentences.forEach(s => {
                    let sTrim = s.trim();
                    if (sTrim) {
                        resultHtml += `<div class="sentence-item"><span class="sentence-num">${count}</span>${sTrim}</div>`;
                        count++;
                    }
                });
            }
        });
        return resultHtml;
    }

    function layTieuDeVaMoDau(doc) {
        let title = doc.querySelector('h1') ? doc.querySelector('h1').innerText.trim() : 'Không tìm thấy Tiêu đề';
        let introParagraphs = doc.querySelectorAll('#intro p');
        let introText = '';
        if (introParagraphs.length > 0) {
            introParagraphs.forEach(p => introText += p.innerText + '\n');
        } else {
            introText = doc.querySelector('#intro') ? doc.querySelector('#intro').innerText.trim() : '';
        }
        return { title, introText };
    }

    async function batDauGhep() {
        const urlGoc = document.getElementById('linkGoc').value.trim();
        const urlDich = document.getElementById('linkDich').value.trim();
        const statusDiv = document.getElementById('status');
        const contentDiv = document.getElementById('content');

        if (!urlGoc || !urlDich) {
            statusDiv.innerHTML = '<span class="error">Vui lòng dán đầy đủ cả 2 link trước khi chạy!</span>';
            return;
        }

        statusDiv.innerHTML = '<span class="loading">Đang lấy dữ liệu và bóc tách (Có thể mất vài giây)... ⚡</span>';
        contentDiv.innerHTML = ''; 

        try {
            const [docGoc, docDich] = await Promise.all([fetchHtml(urlGoc), fetchHtml(urlDich)]);

            // 1. LẤY TIÊU ĐỀ VÀ PHẦN MỞ ĐẦU
            const modauGoc = layTieuDeVaMoDau(docGoc);
            const modauDich = layTieuDeVaMoDau(docDich);

            const introBox = document.createElement('div');
            introBox.className = 'step-box intro-box';
            introBox.innerHTML = `
                <div class="step-header">
                    <div class="step-number">Phần Mở Đầu</div>
                </div>
                <div class="step-body bilingual-row"> 
                    <div class="text-de"> <span class="section-label">🌐 BẢN GỐC</span>
                        <div class="article-title">${modauGoc.title}</div>
                        ${danhSoThuTuCau(modauGoc.introText)}
                    </div>
                    <div class="text-vn"> <span class="section-label">🇻🇳 BẢN DỊCH</span>
                        <div class="article-title">${modauDich.title}</div>
                        ${danhSoThuTuCau(modauDich.introText)}
                    </div>
                </div>
            `;
            contentDiv.appendChild(introBox);

            // 2. LẤY CÁC BƯỚC (STEPS)
            const stepsGoc = docGoc.querySelectorAll('.step');
            const stepsDich = docDich.querySelectorAll('.step');
            const maxSteps = Math.min(stepsGoc.length, stepsDich.length);

            for (let i = 0; i < maxSteps; i++) {
                let textGocHtml = danhSoThuTuCau(stepsGoc[i].innerText);
                let textDichHtml = danhSoThuTuCau(stepsDich[i].innerText);

                const stepBox = document.createElement('div');
                stepBox.className = 'step-box';
                stepBox.innerHTML = `
                    <div class="step-header">
                        <div class="step-number">Bước ${i + 1}</div>
                    </div>
                    <div class="step-body bilingual-row"> 
                        <div class="text-de"> <span class="section-label">🌐 BẢN GỐC</span>
                            ${textGocHtml}
                        </div>
                        <div class="text-vn"> <span class="section-label">🇻🇳 BẢN DỊCH</span>
                            ${textDichHtml}
                        </div>
                    </div>
                `;
                contentDiv.appendChild(stepBox);
            }

            // 3. LẤY CÁC PHẦN PHỤ LỤC (Tips, Warnings, Things You'll Need)
            const phanPhu = [
                { id: '#tips, .tips', title: '💡 Lời khuyên (Tips)' },
                { id: '#warnings, .warnings', title: '⚠️ Cảnh báo (Warnings)' },
                { id: '#thingsyoullneed, .thingsyoullneed', title: '🛠️ Những thứ bạn cần' }
            ];

            phanPhu.forEach(phan => {
                const nodeGoc = docGoc.querySelector(phan.id);
                const nodeDich = docDich.querySelector(phan.id);

                // Nếu có ít nhất 1 bản có phần này thì tiến hành lấy
                if (nodeGoc || nodeDich) {
                    const textGoc = nodeGoc ? nodeGoc.innerText : 'Không có phần này ở bản gốc.';
                    const textDich = nodeDich ? nodeDich.innerText : 'Không có phần này ở bản dịch.';

                    const box = document.createElement('div');
                    box.className = 'step-box extra-box';
                    box.innerHTML = `
                        <div class="step-header">
                            <div class="step-number">${phan.title}</div>
                        </div>
                        <div class="step-body bilingual-row">
                            <div class="text-de">
                                <span class="section-label">🌐 BẢN GỐC</span>
                                ${danhSoThuTuCau(textGoc)}
                            </div>
                            <div class="text-vn">
                                <span class="section-label">🇻🇳 BẢN DỊCH</span>
                                ${danhSoThuTuCau(textDich)}
                            </div>
                        </div>
                    `;
                    contentDiv.appendChild(box);
                }
            });

            statusDiv.innerHTML = `<span class="success">✅ Thành công! Đã ghép Mở đầu, ${maxSteps} bước và các phần phụ.</span>`;

        } catch (error) {
            statusDiv.innerHTML = `<span class="error">❌ Có lỗi xảy ra: ${error.message}</span>`;
        }
    }
</script>

</body>
</html>
